; PlatformIO 專案設定
; 文件: https://docs.platformio.org/page/projectconf.html

[platformio]
; 讓狀態列的 Build/Upload 按鈕預設只處理 uno，不會連帶跑到 native
; (native 只在明確跑 `pio test -e native` 時才需要，平常不該被 Build All 碰到)
default_envs = uno

[env:uno]
platform = atmelavr@^5.3.0     ; 鎖定版本，確保建置可重現
board = uno
framework = arduino
monitor_speed = 115200         ; 與韌體 Serial.begin() 一致
build_flags = -Wall -Wextra
; upload_port = COM3           ; 需要時再指定，通常自動偵測

; PC 上跑的單元測試環境 —— 不需要插板子，只透過 `pio test -e native` 使用。
; src_filter 排除 src/，因為 main.cpp 會 #include <Arduino.h>，native 平台沒有
; 這個框架。這連帶讓一般的 "pio run" (build all，非 test) 對 native 沒東西可編、
; 回報 FAILED —— 是預期中的訊息，不影響 `pio test -e native` 或 uno 的建置/燒錄。
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
; 改用 lld 連結，原因見 use_lld.py 內的說明
extra_scripts = pre:use_lld.py
